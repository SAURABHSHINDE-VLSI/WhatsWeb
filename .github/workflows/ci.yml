name: WhatsUS CI Pipeline

on:
  push:
    branches: [main, master, production-readiness]
  pull_request:
    branches: [main, master, production-readiness]

jobs:
  test-and-build:
    name: Lint, Test, Typecheck & Build
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: whatsus
          POSTGRES_PASSWORD: whatsus_secret
          POSTGRES_DB: whatsus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate --workspace=server

      - name: Deploy Prisma PostgreSQL Migrations
        env:
          DATABASE_URL: postgresql://whatsus:whatsus_secret@localhost:5432/whatsus?schema=public
        run: npx prisma migrate deploy --schema server/prisma/schema.prisma

      - name: Type-Check & Build Server
        run: npm run build:server

      - name: Type-Check & Build Client PWA
        run: npm run build

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql://whatsus:whatsus_secret@localhost:5432/whatsus?schema=public
          JWT_SECRET: ci_test_jwt_secret_012345678901234567890123456789012
          NODE_ENV: test
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: whatsus:ci
